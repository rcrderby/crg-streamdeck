# Dependabot configuration for GitHub Actions versions
# https://docs.github.com/code-security/dependabot/dependabot-version-updates

---
version: 2

updates:
  # Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # One pull request per run, so related action bumps are reviewed
      # and merged together
      github-actions:
        patterns:
          - '*'
